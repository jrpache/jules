{% extends "base.html" %}

{% block content %}
    <h1>Products</h1>
    <p><a href="{{ url_for('products.add_product') }}">Add Product</a></p>
    <table>
        <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Type</th>
                <th>Price</th>
                <th>VAT</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.code }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.product_type }}</td>
                <td>{{ product.price }}</td>
                <td>{{ product.vat_type }}</td>
                <td>
                    <a href="{{ url_for('products.edit_product', id=product.id) }}">Edit</a>
                    <form action="{{ url_for('products.delete_product', id=product.id) }}" method="post" style="display:inline;">
                        <input type="submit" value="Delete" onclick="return confirm('Are you sure you want to delete this product?');">
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
